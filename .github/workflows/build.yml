name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev automake build-essential

      - name: Instalar Buildozer
        # Ojo: el "python-for-android" que se instala acá con pip casi no se usa.
        # Buildozer clona su PROPIA copia de python-for-android desde GitHub
        # (rama definida por "p4a.branch" en buildozer.spec) dentro de
        # .buildozer/android/platform/, y usa esa, no la de pip. El pin real
        # que importa esta en buildozer.spec (p4a.branch = v2023.09.16).
        run: pip install "buildozer==1.5.0" "cython<3.1"

      - name: Build con Buildozer
        run: yes | buildozer -v android debug

      - name: Subir el .apk como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: kholin-music-apk
          path: bin/*.apk
